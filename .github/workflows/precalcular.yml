name: Precalcular curvas
on:
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Recalcular todas las celdas (1) o solo las que falten (0)'
        default: '0'
  schedule:
    - cron: '23 3 1 * *'   # el día 1 de cada mes, recalcula todo
permissions:
  contents: write
concurrency: precalcular
jobs:
  precalcular:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calcular tramos de curvas
        env:
          FORZAR: ${{ github.event_name == 'schedule' && '1' || inputs.forzar }}
        run: node scripts/precalcular.mjs
      - name: Publicar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data/curvas
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -qm "Actualiza curvas precalculadas"
          git pull -q --rebase origin main
          git push origin HEAD:main
