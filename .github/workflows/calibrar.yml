name: Calibrar curvas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calibrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analizar zonas reales
        run: node scripts/calibrar.mjs
      - name: Dibujar mapas
        run: |
          pip install --quiet matplotlib
          python3 scripts/calibrar_mapas.py
      - name: Guardar resultados en la rama calibracion
        run: |
          cp -r calibracion /tmp/cal
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan calibracion
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/cal/* .
          git add -A
          git commit -qm "Resultados de calibración"
          git push -f origin calibracion
